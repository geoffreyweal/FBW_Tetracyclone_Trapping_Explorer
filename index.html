<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>FBW Tetracyclone Trapping Explorer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <div class="title">
    <h1>[2.2.2] carbene + tetracyclone: FBW rearrangement and trapping</h1>
    <p class="sub">Section B of the 6→7 system: M06-2X/def2-TZVP D3Zero, CPCM. Click any energy level, table row or path to see the structure in 3D.</p>
  </div>
  <nav id="tabs" class="seg" role="tablist">
    <button role="tab" data-tab="routes" class="on" aria-selected="true">Routes</button>
    <button role="tab" data-tab="species" aria-selected="false">Structures</button>
    <button role="tab" data-tab="paths" aria-selected="false">Paths</button>
    <button role="tab" data-tab="about" aria-selected="false">About</button>
  </nav>
</header>

<main>
  <section id="tab-routes" class="tab on" role="tabpanel">
    <aside id="routelist" class="list"></aside>
    <div class="work">
      <div class="card">
        <div class="bar">
          <span id="routetitle" class="cardtitle"></span>
          <span class="seg small" id="emode">
            <button data-mode="G" class="on" aria-pressed="true">qh-G</button>
            <button data-mode="E" aria-pressed="false">Electronic E</button>
          </span>
        </div>
        <p id="routedesc" class="desc"></p>
        <div id="diagram" class="diagram"></div>
        <p id="diagramnote" class="note"></p>
      </div>
      <div class="card viewcard">
        <div class="mol" id="routeviewer"><div class="hint">Click an energy level to view its structure</div></div>
        <div id="routeinfo" class="info"></div>
      </div>
    </div>
  </section>

  <section id="tab-species" class="tab" role="tabpanel">
    <div class="work wide">
      <div class="card tablecard">
        <div class="tablewrap"><table id="sptable"></table></div>
      </div>
      <div class="card viewcard">
        <div class="mol" id="spviewer"><div class="hint">Click a structure in the table</div></div>
        <div id="spinfo" class="info"></div>
      </div>
    </div>
  </section>

  <section id="tab-paths" class="tab" role="tabpanel">
    <aside id="pathlist" class="list"></aside>
    <div class="work">
      <div class="card viewcard">
        <div class="mol" id="pathviewer"><div class="hint">Choose a path on the left</div></div>
        <div class="player">
          <button id="pfirst" title="First frame" aria-label="First frame">⏮</button>
          <button id="pprev" title="Previous frame" aria-label="Previous frame">◀</button>
          <button id="pplay" title="Play / pause" aria-label="Play or pause">▶</button>
          <button id="pnext" title="Next frame" aria-label="Next frame">▶︎|</button>
          <input id="pslider" type="range" min="0" max="0" value="0" aria-label="Frame">
          <span id="pframe" class="mono"></span>
        </div>
      </div>
      <div class="card">
        <div id="pathplot" class="pathplot"></div>
        <div id="pathinfo" class="info"></div>
      </div>
    </div>
  </section>

  <section id="tab-about" class="tab" role="tabpanel">
    <div class="about card" id="about"></div>
  </section>
</main>

<script src="assets/3Dmol-min.js"></script>
<script src="data/data.js"></script>
<script src="data/paths.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
